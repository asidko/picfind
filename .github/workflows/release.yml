name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -mod=readonly ./...
      - run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh all
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: picfind-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: picfind-linux-arm64
          - os: macos-latest
            asset: picfind-macos-arm64
          - os: macos-latest
            asset: picfind-macos-x86_64
            rosetta: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: internal/ahash/testdata
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: smoke test the packaged binary
        env:
          ASSET: ${{ matrix.asset }}
          ROSETTA: ${{ matrix.rosetta }}
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            grep " ${ASSET}\$" SHA256SUMS | sha256sum -c -
          else
            grep " ${ASSET}\$" SHA256SUMS | shasum -a 256 -c -
          fi
          chmod +x "$ASSET"
          if [ "$ROSETTA" = "true" ]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          "./$ASSET" --version | tee version.txt
          grep -q "^picfind ${GITHUB_REF_NAME#v} (" version.txt
          "./$ASSET" --help >/dev/null
          grep -o '"[a-z0-9_.]*": {"hash": "[0-9a-f]\{16\}"' ../internal/ahash/testdata/hashes.json | sed 's/"\([^"]*\)": {"hash": "\([0-9a-f]*\)"/\1 \2/' > goldens.txt
          [ "$(wc -l < goldens.txt)" -ge 10 ] || { echo "golden hashes not found" >&2; exit 1; }
          while read -r file want; do
            got=$("./$ASSET" --image-file "../internal/ahash/testdata/$file")
            [ "$got" = "$want" ] || { echo "hash mismatch on $file: got $got, want $want" >&2; exit 1; }
          done < goldens.txt
          echo "hashes match Python imagehash on $(wc -l < goldens.txt | tr -d ' ') fixtures"

  release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: draft the release with every asset
        run: |
          cat > notes.md <<'EOF'
          **picfind** crawls a website and ranks every image on it by distance to the aHash you give it, so you find the exact page that shows a picture. One small static binary, nothing else to install.

          ## Highlights
          - Search by a 16-hex aHash, the long 32-hex form (first 16 hex are used), or a local image with `--image-file`.
          - Three ways to cover a site: crawl from a URL, numbered listing pages (`--page-template`), or your own URL list (`--urls-file`). `--stay-under` keeps a crawl inside the start path at any depth; `--visit-pages-regex` keeps it to matching pages, or opens matching links one hop from the listed pages; `--visit-images-regex` limits which images get hashed.
          - Matches print live as `[FOUND]` lines while the crawl runs (no page limit by default); at the end come the closest images with the page each one is on and a `match:` or `no match:` verdict.
          - Hashes match the Python `imagehash` library: bit-for-bit on PNG, WebP (animated too: first frame), BMP and GIF; on JPEG about 1% of files differ by 1-2 bits, well inside the 0-4 match range.
          - Backs off when a site answers HTTP 429. The first Ctrl-C stops crawling and finishes hashing what was found, a second one stops hashing; the results so far are always printed.

          ## Platforms
          - Linux x86_64 and arm64
          - macOS arm64 (Apple Silicon) and x86_64 (Intel)

          ## Install

          Installs `picfind` to `~/.local/bin` (detects OS/CPU, verifies the SHA256 checksum):

          ```
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh -s -- --tag ${{ github.ref_name }}
          ```

          ### Manual

          Download the asset for your platform plus `SHA256SUMS`, verify, then install:

          ```
          sha256sum -c SHA256SUMS --ignore-missing      # macOS: shasum -a 256 -c SHA256SUMS --ignore-missing
          chmod +x picfind-* && mkdir -p ~/.local/bin && mv picfind-* ~/.local/bin/picfind
          ```

          macOS, if the browser downloaded it: `xattr -d com.apple.quarantine ~/.local/bin/picfind`

          ## Quickstart

          ```
          picfind https://example.com --image-file photo.jpg    # crawl the site, find where photo.jpg appears
          picfind https://example.com 3c7e7e3c18183c7e          # same, from an aHash
          ```
          EOF
          gh release create "$TAG" dist/picfind-* dist/SHA256SUMS --repo "$REPO" --draft --title "$TAG - find the web page that shows an image" --notes-file notes.md
      - name: verify every asset is attached, then publish
        run: |
          count=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets | length')
          [ "$count" = "5" ] || { echo "expected 5 assets, found $count - release left as draft" >&2; exit 1; }
          gh release edit "$TAG" --repo "$REPO" --draft=false
